server:
  port: 9000

logging:
  level:
    com.baedal: DEBUG
    com.baedal.gateway.filter: TRACE

jwt:
  secret: my-local-secret-key-should-be-long-enough
  expiration: 1800

  headerName: Authorization
  granted: Bearer

  loginUrlEndsWith: /login

spring:
  cloud:
    gateway:
      routes:
        - id: customer
          uri: http://localhost:8080
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=1
            - name: PostAuthenticationFilterFactory
              args:
                role: CUSTOMER

        - id: rider
          uri: http://localhost:8081
          predicates:
            - Path=/api/rider/**
          filters:
            - StripPrefix=1
            - name: PostAuthenticationFilterFactory
              args:
                role: RIDER

        - id: owner
          uri: http://localhost:8082
          predicates:
            - Path=/api/owner/**
          filters:
            - StripPrefix=1
            - name: PostAuthenticationFilterFactory
              args:
                role: OWNER
